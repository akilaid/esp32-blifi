name: blifi
description: >-
  BLE-based Wi-Fi provisioning for ESP32: send Wi-Fi credentials over an
  encrypted (X25519 + AES-256-GCM) Bluetooth Low Energy session — no hotspot.
version: 0.1.1
repository: https://github.com/akilaid/esp32-blifi
homepage: https://github.com/akilaid/esp32-blifi
issue_tracker: https://github.com/akilaid/esp32-blifi/issues

topics:
  - bluetooth
  - ble
  - esp32
  - wifi
  - provisioning

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
