# Publish the blifi ESP-IDF component to the ESP Component Registry
# (https://components.espressif.com, id `akilaid/blifi`), fully automatic.
#
#   - pull_request touching the component: runs the action with dry_run, so the
#     registry validates the manifest without creating a version.
#   - push to main: the real upload. The action reads `version:` from
#     idf_component.yml and is idempotent - if that version already exists it
#     skips silently, so merges that don't bump the version are safe no-ops. To
#     release, just bump `version:` and merge.
#
# Why the confirm step: blifi's dependency graph (NimBLE + mbedTLS/PSA) makes the
# registry's server-side "Processing examples" step take minutes. The upload
# action polls with a short timeout and can report FAILURE even though the
# version publishes a little later (observed on 0.1.2 and 0.1.3). So on a real
# push we let the action be best-effort and then poll the registry API for the
# version - the job is green only when the version is actually live, red only
# when it genuinely never appears.
#
# Requires the `IDF_COMPONENT_API_TOKEN` repo secret: create it at
# https://components.espressif.com -> profile -> Tokens, with the
# `write:components` scope. (dry_run does not need a valid token.)
name: component-publish

on:
  push:
    branches: [main]
    paths:
      - 'firmware/components/blifi/**'
      - '.github/workflows/component-publish.yml'
  pull_request:
    paths:
      - 'firmware/components/blifi/**'
      - '.github/workflows/component-publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload to ESP Component Registry
        id: upload
        # Best-effort: the action can time out waiting for slow example
        # processing even when the publish succeeds. The confirm step below is
        # the real gate on a push; on a PR (dry_run) this step is authoritative.
        continue-on-error: ${{ github.event_name == 'push' }}
        uses: espressif/upload-components-ci-action@v2
        with:
          namespace: akilaid
          # v2 syntax: `component_name:relative/path`. Version is read from the
          # component's idf_component.yml `version:` field, not overridden here.
          components: "blifi:firmware/components/blifi"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
          # Validate-only on PRs; real upload on push to main.
          dry_run: ${{ github.event_name == 'pull_request' }}

      - name: Confirm the version is live on the registry
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version=$(grep -E '^version:' firmware/components/blifi/idf_component.yml | head -1 | sed -E 's/[^"]*"([^"]+)".*/\1/')
          echo "Confirming blifi ${version} on the ESP Component Registry..."
          for i in $(seq 1 24); do
            if curl -sSL "https://components.espressif.com/api/components/akilaid/blifi" \
                 | grep -q "\"version\":\"${version}\""; then
              echo "blifi ${version} is live."
              exit 0
            fi
            echo "  not visible yet (attempt ${i}/24); waiting 15s..."
            sleep 15
          done
          echo "::error::blifi ${version} did not appear on the registry after ~6 minutes."
          exit 1
