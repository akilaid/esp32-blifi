# Cut an Arduino Library Manager release: tag + GitHub Release on the mirror repo
# when arduino/Blifi/library.properties has a newer version than the mirror's
# latest tag. Runs AUTOMATICALLY right after arduino-mirror finishes syncing the
# mirror on a push to main; it self-guards, so it only tags when the version was
# actually bumped and is a harmless no-op otherwise. See ADR 0006.
#
# Requires the same `ARDUINO_MIRROR_PAT` (contents: write on the mirror repo).
name: arduino-release

on:
  workflow_run:
    workflows: ["arduino-mirror"]
    types: [completed]

jobs:
  release:
    runs-on: ubuntu-latest
    # Only after a successful mirror sync on main (the mirror must hold the new
    # library.properties before we compare versions against its tags).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    steps:
      - name: Clone mirror repo (full clone → brings tags)
        env:
          MIRROR_TOKEN: ${{ secrets.ARDUINO_MIRROR_PAT }}
        run: |
          git clone "https://x-access-token:${MIRROR_TOKEN}@github.com/akilaid/esp32-blifi-arduino.git" _mirror

      - name: Compare library.properties version to latest tag
        id: check
        working-directory: _mirror
        run: |
          if [ ! -f library.properties ]; then
            echo "::error::mirror has no library.properties yet - run arduino-mirror first"; exit 1
          fi
          version=$(grep -E '^version=' library.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::no version= in library.properties"; exit 1
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=${latest:-<none>}" >> "$GITHUB_OUTPUT"
          if [ -z "$latest" ]; then
            newer=true
          elif [ "$version" = "$latest" ]; then
            newer=false
          else
            top=$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)
            [ "$top" = "$version" ] && newer=true || newer=false
          fi
          echo "newer=$newer" >> "$GITHUB_OUTPUT"
          echo "library.properties=$version, latest tag=${latest:-<none>}, newer=$newer"

      - name: Tag + create release
        if: steps.check.outputs.newer == 'true'
        working-directory: _mirror
        env:
          GH_TOKEN: ${{ secrets.ARDUINO_MIRROR_PAT }}
          V: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "blifi-mirror[bot]"
          git config user.email "blifi-mirror@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"
          gh release create "v$V" \
            --repo akilaid/esp32-blifi-arduino \
            --title "v$V" \
            --notes "Blifi Arduino library v$V - mirrored from akilaid/esp32-blifi. The Arduino Library Manager picks up this tagged release automatically."

      - name: Nothing to release
        if: steps.check.outputs.newer != 'true'
        run: |
          echo "Version ${{ steps.check.outputs.version }} is not newer than the latest tag (${{ steps.check.outputs.latest }}). Bump version= in arduino/Blifi/library.properties first."
