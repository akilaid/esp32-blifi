# Analyze, test, publish-dry-run and score the blifi Flutter package.
name: flutter-package-ci

on:
  push:
    branches: [main]
    paths:
      - 'flutter/packages/blifi/**'
      - '.github/workflows/flutter-package-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter/packages/blifi/**'
      - '.github/workflows/flutter-package-ci.yml'

jobs:
  analyze-test:
    name: analyze / test / publish-dry-run / pana
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/packages/blifi
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: pub publish dry-run
        run: dart pub publish --dry-run
      - name: pana score (informational)
        continue-on-error: true
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning .
