# Analyze, test, and build the demo app APK.
name: flutter-app-ci

on:
  push:
    branches: [main]
    paths:
      - 'flutter/apps/demo_app/**'
      - 'flutter/packages/blifi/**'   # demo path-depends on the package
      - '.github/workflows/flutter-app-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter/apps/demo_app/**'
      - 'flutter/packages/blifi/**'
      - '.github/workflows/flutter-app-ci.yml'

jobs:
  build-apk:
    name: analyze / test / build apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/apps/demo_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
