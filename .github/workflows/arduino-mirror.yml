# Continuously mirror arduino/Blifi/ (flattened to the repo root) into
# akilaid/esp32-blifi-arduino so the Arduino Library Manager can index it.
# See docs/adr/0006-arduino-distribution-mirror.md.
#
# Requires a fine-grained PAT `ARDUINO_MIRROR_PAT` with `contents: write` scoped
# ONLY to akilaid/esp32-blifi-arduino (the default GITHUB_TOKEN cannot push to
# another repository). That secret must be created manually — see the ADR.
name: arduino-mirror

on:
  push:
    branches: [main]
    paths:
      - 'arduino/Blifi/**'
      - 'arduino/mirror-README-banner.md'
      - '.github/workflows/arduino-mirror.yml'

concurrency: arduino-mirror   # never run two syncs at once

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Clone mirror repo (tolerates an empty/uninitialised repo)
        env:
          MIRROR_TOKEN: ${{ secrets.ARDUINO_MIRROR_PAT }}
        run: |
          # A raw clone handles an empty repo (unlike actions/checkout, which
          # needs an existing branch); the first sync then creates `main`.
          git clone "https://x-access-token:${MIRROR_TOKEN}@github.com/akilaid/esp32-blifi-arduino.git" _mirror

      - name: Sync arduino/Blifi/ → mirror root
        run: |
          # Copy the CONTENTS of arduino/Blifi/ to the mirror root, deleting stale
          # files. Never touch the mirror's .git; drop the .development marker (its
          # presence blocks Library Manager indexing) and local build output.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.development' \
            --exclude '.pio/' \
            --exclude 'managed_components/' \
            arduino/Blifi/ _mirror/
          # Rebuild the mirror README = generated banner + the library's own README.
          cat arduino/mirror-README-banner.md arduino/Blifi/README.md > _mirror/README.md

      - name: Commit & push if changed
        working-directory: _mirror
        run: |
          git config user.name "blifi-mirror[bot]"
          git config user.email "blifi-mirror@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "mirror already up to date — nothing to push"
            exit 0
          fi
          git commit -m "Sync from esp32-blifi@${GITHUB_SHA::7}"
          git push origin HEAD:main   # creates main on first run, updates it after
