dependencies:
  akilaid/blifi:
    # Floor at 0.3.0: these examples use cfg.manage_nvs (and blifi-managed NVS),
    # which landed in 0.3.0. An open lower bound (not "*") lets a later component
    # minor bump resolve cleanly while excluding versions too old to compile.
    version: ">=0.3.0"
    # Inside the monorepo (and CI) build against the local component; when this
    # example is extracted via `idf.py create-project-from-example`, the path
    # does not exist and the component is fetched from the registry instead.
    override_path: "../../.."
